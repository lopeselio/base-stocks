name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @base-stocks/sdk typecheck
      - run: pnpm --filter @base-stocks/sdk build
      - run: pnpm --filter @base-stocks/sdk test
      - name: live mainnet tests
        run: pnpm --filter @base-stocks/sdk test
        env:
          LIVE: "1"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
      - name: fork tests (Base mainnet)
        run: forge test --mc ForkTest -vv
        env:
          BASE_RPC_URL: https://mainnet.base.org
